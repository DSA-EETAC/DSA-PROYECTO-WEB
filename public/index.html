<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Run | Dungeon Access</title>
    <link rel="stylesheet" href="style_nuevo.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="dungeon-overlay"></div>

<div id="contenedor-login" class="card">
    <header>
        <div class="idol-icon"></div>
        <h1>TEMPLE RUN</h1>
        <p class="subtitle">MAZMORRA DE ACCESO</p>
    </header>

    <main>
        <div id="seccion-login" class="form-fade">
            <div class="input-container">
                <input type="text" id="login-nombre" required>
                <label>NOMBRE DEL EXPLORADOR</label>
                <div class="bar"></div>
            </div>
            <div class="input-container">
                <input type="password" id="login-pass" required>
                <label>CONTRASEÑA</label>
                <div class="bar"></div>
            </div>
            <button class="btn-primary" onclick="hacerLogin()">DESCENDER</button>
            <p class="switch-text">¿Eres nuevo? <span onclick="cambiarVista('registro')">CREA UN AVATAR</span></p>
        </div>

        <div id="seccion-registro" class="form-fade hidden">
            <div class="input-container">
                <input type="text" id="reg-nombre" required>
                <label>NUEVO ALIAS</label>
                <div class="bar"></div>
            </div>
            <div class="input-container">
                <input type="password" id="reg-pass" required>
                <label>CONTRASEÑA</label>
                <div class="bar"></div>
            </div>
            <div class="input-container">
                <input type="password" id="reg-pass-confirm" required>
                <label>CONFIRMAR CONTRASEÑA</label>
                <div class="bar"></div>
            </div>
            <div class="input-container">
                <input type="email" id="reg-correo" required>
                <label>CORREO ELECTRÓNICO</label>
                <div class="bar"></div>
            </div>
            <button class="btn-primary" onclick="hacerRegistro()">UNIRSE A LA EXPEDICIÓN</button>
            <p class="switch-text">¿Ya tienes cuenta? <span onclick="cambiarVista('login')">VOLVER</span></p>
        </div>
    </main>
</div>

<div id="seccion-dashboard" class="form-fade hidden dashboard-container">

    <div class="dashboard-header">
        <h2 id="mensaje-bienvenida">CAMPAMENTO BASE</h2>
        <div class="header-stats">
            <p class="monedas-display">🪙 <span id="contador-monedas">0</span></p>
            <button class="btn-accion" onclick="abrirUnity()">🏃 ADENTRARSE EN LA MAZMORRA</button>
        </div>
    </div>

    <div class="tabs-menu">
        <button id="btn-perfil" class="tab-btn active" onclick="cambiarPestana('tab-perfil', 'btn-perfil')">PERFIL</button>
        <button id="btn-tienda" class="tab-btn" onclick="cambiarPestana('tab-tienda', 'btn-tienda')">TIENDA</button>
        <button id="btn-inventario" class="tab-btn" onclick="cambiarPestana('tab-inventario', 'btn-inventario')">MOCHILA</button>
        <button id="btn-grupos" class="tab-btn" onclick="cambiarPestana('tab-grupos', 'btn-grupos')">GRUPOS</button>
        <button id="btn-eventos" class="tab-btn" onclick="cambiarPestana('tab-eventos', 'btn-eventos')">MISIONES</button>
    </div>

    <div id="tab-tienda" class="tab-content" style="display: none;">
        <h3 class="tab-titulo">Bienes del Mercader</h3>
        <div id="contenedor-items-tienda" class="grid-fluido"></div>
    </div>

    <div id="tab-inventario" class="tab-content" style="display: none;">
        <div id="contenedor-inventario">
            <h3 class="tab-titulo">Tus Pertinencias</h3>
            <p class="texto-vacio">Cargando inventario...</p>
        </div>
    </div>

    <div id="tab-perfil" class="tab-content">
        <h3 class="tab-titulo">Datos del Explorador</h3>
        <div class="perfil-info">
            <p style="font-size: 1.2rem;">Nombre: <span id="perfil-nombre" class="resaltado-oro"></span></p>
            <div class="perfil-botones">
                <button class="btn-mostrar-grupo" onclick="consultarMiGrupo()">MOSTRAR EQUIPO</button>
                <button class="btn-cerrar-sesion" onclick="cerrarSesion()">ABANDONAR CAMPAMENTO</button>
            </div>
        </div>

        <div id="contenedor-grupo" class="hidden">
            <h3 id="grupo-titulo"></h3>
            <p id="grupo-mensaje"></p>
            <ul id="grupo-lista-miembros"></ul>
            <button class="btn-primary" style="margin-top: 15px; width: 100%;" onclick="document.getElementById('contenedor-grupo').classList.add('hidden')">CERRAR</button>
        </div>
    </div>

    <div id="tab-grupos" class="tab-content" style="display: none;">
        <h3 class="tab-titulo">Gremios y Equipos</h3>
        <div id="contenedor-grupos" class="grid-fluido"></div>
    </div>

    <div id="tab-eventos" class="tab-content" style="display: none;">
        <h3 class="tab-titulo">Tablón de Misiones Especiales</h3>
        <div id="contenedor-eventos" class="grid-fluido"></div>
    </div>

</div>

<div id="mensaje-sistema" class="oculto"></div>

<script src="script.js?v=6"></script>
</body>
</html>
